name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Same safeguard as forgerig: automerge pushes with GITHUB_TOKEN do not
  # raise `push` events, so the automerge job dispatches this workflow on main
  # to rebuild + republish the rolling `latest` AAR release.
  workflow_dispatch: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: 1337farm/actions/setup-jdk@v1
        with:
          java-version: "17"

      - name: Set up Android SDK
        uses: 1337farm/actions/setup-android-env@v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle dependency + wrapper cache (same paths/keys as
      # actions/setup-java `cache: gradle` in forgerig; our shared setup-jdk
      # installs the JDK only, so cache explicitly with actions/cache@v4).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run library unit tests
        run: ./gradlew :gatekeeper:testDebugUnitTest :gatekeeper-litert:testDebugUnitTest :gatekeeper-ort:testDebugUnitTest :app:testDebugUnitTest --stacktrace

  package-aar:
    name: aar
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: 1337farm/actions/setup-jdk@v1
        with:
          java-version: "17"

      - name: Set up Android SDK
        uses: 1337farm/actions/setup-android-env@v1

      - name: Grant execute permission
        run: chmod +x gradlew scripts/smoke-test.sh scripts/fetch-ort-android.sh

      # NDK + CMake for the :gatekeeper-ort native build (shared action;
      # NDK dir cached — multi-GB download on a cold cache otherwise).
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-27.0.12077973

      - name: Setup Android NDK
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: "27.0.12077973"

      - name: Install CMake 3.22.1
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmake;3.22.1"

      # bundletool for the split delivery (scripts/build-splits.sh) — ~200MB jar,
      # cached so the bundle job stays fast on repeat runs.
      - name: Cache bundletool
        uses: actions/cache@v4
        with:
          path: .cache/bundletool-all-1.18.3.jar
          key: bundletool-1.18.3

      # Same Gradle cache as the test job: dependency + wrapper reuse across
      # runs, keyed on build scripts (matches forgerig's setup-java behavior).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Smoke test (unit + AAR + archive checks)
        run: bash scripts/smoke-test.sh

      - name: Assemble demo APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-AAR
          path: gatekeeper/build/outputs/aar/gatekeeper-release.aar
          retention-days: 30

      - name: Upload LiteRT backend AAR artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-LiteRT-AAR
          path: gatekeeper-litert/build/outputs/aar/gatekeeper-litert-release.aar
          retention-days: 30

      - name: Upload ORT native backend AAR artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-ORT-AAR
          path: gatekeeper-ort/build/outputs/aar/gatekeeper-ort-release.aar
          retention-days: 30

      - name: Upload demo APK artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Package app bundle + splits
        # base + frozen arm64 runtime split + .apks set (bundletool, demo keystore).
        # SHA must equal the publish step's head.sha; pass it explicitly because
        # GITHUB_SHA in a PR run points at the synthetic merge ref, not head.sha.
        env:
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/build-splits.sh

      - name: Publish AAR release
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/aar-release"
          mkdir -p "$OUT"
          AAR="$(find gatekeeper/build/outputs/aar -name 'gatekeeper-release.aar' | head -1)"
          [ -n "$AAR" ] || { echo "ERROR: no gatekeeper-release.aar to publish"; exit 1; }
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          SHA="$(printf '%s' "$SHA" | cut -c1-10)"
          AAR_NAME="gatekeeper-release-$SHA.aar"
          cp "$AAR" "$OUT/$AAR_NAME"
          APK="$(find app/build/outputs/apk/debug -name 'app-debug.apk' | head -1)"
          [ -n "$APK" ] || { echo "ERROR: no app-debug.apk to publish"; exit 1; }
          APK_NAME="gatekeeper-demo-$SHA.apk"
          cp "$APK" "$OUT/$APK_NAME"
          LITERT_AAR="$(find gatekeeper-litert/build/outputs/aar -name 'gatekeeper-litert-release.aar' | head -1)"
          [ -n "$LITERT_AAR" ] || { echo "ERROR: no gatekeeper-litert-release.aar to publish"; exit 1; }
          LITERT_NAME="gatekeeper-litert-$SHA.aar"
          cp "$LITERT_AAR" "$OUT/$LITERT_NAME"
          ORT_AAR="$(find gatekeeper-ort/build/outputs/aar -name 'gatekeeper-ort-release.aar' | head -1)"
          [ -n "$ORT_AAR" ] || { echo "ERROR: no gatekeeper-ort-release.aar to publish"; exit 1; }
          ORT_NAME="gatekeeper-ort-$SHA.aar"
          cp "$ORT_AAR" "$OUT/$ORT_NAME"
          # Split delivery (scripts/build-splits.sh): base APK + frozen native
          # runtime split + full .apks set. The frozen versionCode lets an older
          # runtime split pair with any newer base (adb install-multiple -r).
          BASE_APK="$(find apk-out -name 'gatekeeper-base-*.apk' | head -1)"
          [ -n "$BASE_APK" ] || { echo "ERROR: no base split APK to publish"; exit 1; }
          RUNTIME_APK="$(find apk-out -name 'gatekeeper-runtime-arm64-*.apk' | head -1)"
          [ -n "$RUNTIME_APK" ] || { echo "ERROR: no runtime split APK to publish"; exit 1; }
          SPLITS="$(find apk-out -name 'gatekeeper-splits-*.apks' | head -1)"
          [ -n "$SPLITS" ] || { echo "ERROR: no .apks set to publish"; exit 1; }
          cp "$BASE_APK" "$OUT/$(basename "$BASE_APK")"
          cp "$RUNTIME_APK" "$OUT/$(basename "$RUNTIME_APK")"
          cp "$SPLITS" "$OUT/$(basename "$SPLITS")"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          NAMES="$AAR_NAME $APK_NAME $LITERT_NAME $ORT_NAME $(basename "$BASE_APK") $(basename "$RUNTIME_APK") $(basename "$SPLITS")"
          PAIRS=""
          for n in $NAMES; do
            PAIRS="$PAIRS\"$n\":\"$(sum "$OUT/$n")\","
          done
          PAIRS="${PAIRS%,}"
          printf '{"commit":"%s","built_at":"%s","files":{%s}}\n' "$SHA" "$DATE" "$PAIRS" > "$OUT/aar-manifest.json"
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest "$OUT/$AAR_NAME" "$OUT/$APK_NAME" "$OUT/$LITERT_NAME" "$OUT/$ORT_NAME" "$OUT/$(basename "$BASE_APK")" "$OUT/$(basename "$RUNTIME_APK")" "$OUT/$(basename "$SPLITS")" "$OUT/aar-manifest.json" --repo "${{ github.repository }}" \
            --title "ForgeGatekeeper AAR (latest)" \
            --notes "Rolling release: AARs + demo monolith APK + base/runtime split pair. Re-published on every green build."

  automerge:
    name: Auto-merge PR
    needs: [package-aar]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --delete-branch

      - name: Rebuild and republish latest from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run android.yml --repo "${{ github.repository }}" --ref main
