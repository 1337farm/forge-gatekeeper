name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: 1337farm/actions/setup-jdk@v1
        with:
          java-version: "17"
      - name: Set up Android SDK
        uses: 1337farm/actions/setup-android-env@v1
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run library unit tests
        run: ./gradlew :gatekeeper:testDebugUnitTest :gatekeeper-litert:testDebugUnitTest :gatekeeper-ort:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

  package-aar:
    name: aar
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: 1337farm/actions/setup-jdk@v1
        with:
          java-version: "17"
      - name: Set up Android SDK
        uses: 1337farm/actions/setup-android-env@v1
      - name: Grant execute permission
        run: chmod +x gradlew scripts/smoke-test.sh
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-27.0.12077973
      - name: Setup Android NDK
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: "27.0.12077973"
      - name: Install CMake 3.22.1
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmake;3.22.1"
      - name: Smoke test (unit + AAR + archive checks)
        run: bash scripts/smoke-test.sh
      - name: Assemble demo APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-AAR
          path: gatekeeper/build/outputs/aar/gatekeeper-release.aar
          retention-days: 30
      - name: Upload LiteRT backend AAR artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-LiteRT-AAR
          path: gatekeeper-litert/build/outputs/aar/gatekeeper-litert-release.aar
          retention-days: 30
      - name: Upload ORT native backend AAR artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeGatekeeper-ORT-AAR
          path: gatekeeper-ort/build/outputs/aar/gatekeeper-ort-release.aar
          retention-days: 30

  automerge:
    name: Auto-merge PR
    needs: [package-aar]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --delete-branch
      - name: Rebuild and republish latest from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run android.yml --repo "${{ github.repository }}" --ref main