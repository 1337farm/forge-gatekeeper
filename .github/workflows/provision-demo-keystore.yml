name: Provision demo keystore

# One-shot generator for keystore/nanogatekeeper-demo.keystore (run manually,
# download the artifact, commit it on a branch). After that every CI build
# signs with the same certificate so the demo APK updates in place.
on:
  workflow_dispatch: {}

jobs:
  provision:
    name: provision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: 1337farm/actions/setup-jdk@v1
        with:
          java-version: "17"

      - name: Generate demo keystore
        run: |
          rm -f nanogatekeeper-demo.keystore
          keytool -genkeypair \
            -keystore nanogatekeeper-demo.keystore \
            -alias demo -keyalg RSA -keysize 2048 -validity 9125 \
            -storepass nanogatekeeper -keypass nanogatekeeper \
            -dname "CN=NanoGatekeeper Demo, OU=Demo, O=1337farm"
          keytool -list -keystore nanogatekeeper-demo.keystore \
            -storepass nanogatekeeper | head -5

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v6
        with:
          name: demo-keystore
          path: nanogatekeeper-demo.keystore
          retention-days: 7
